<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Roblox Claim Review</title>
  <desc id="desc">Premium dark and gold social preview image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.48" stop-color="#090d16"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#f4d675"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="52"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="190" fill="#38bdf8" opacity="0.28" filter="url(#blur)"/>
  <circle cx="1020" cy="520" r="240" fill="#d4af37" opacity="0.22" filter="url(#blur)"/>
  <rect x="70" y="70" width="1060" height="490" rx="42" fill="rgba(15,23,42,.72)" stroke="rgba(255,255,255,.18)"/>
  <text x="110" y="170" fill="#f4d675" font-family="Inter, Arial" font-size="28" font-weight="800" letter-spacing="5">FREE INTAKE REVIEW</text>
  <text x="110" y="285" fill="#f8fafc" font-family="Georgia, serif" font-size="82" font-weight="700">Roblox Claim</text>
  <text x="110" y="375" fill="#f8fafc" font-family="Georgia, serif" font-size="82" font-weight="700">Review for Families</text>
  <text x="110" y="452" fill="#a8b3c7" font-family="Inter, Arial" font-size="30">Unauthorized charges • Refunds • Child safety</text>
  <rect x="110" y="490" width="260" height="62" rx="31" fill="url(#gold)"/>
  <text x="145" y="531" fill="#05070c" font-family="Inter, Arial" font-size="24" font-weight="900">START REVIEW</text>
</svg>
