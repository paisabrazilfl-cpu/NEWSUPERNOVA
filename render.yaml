services:
  - type: web
    name: bos-aura
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: NODE_ENV=development npx --yes pnpm@9 install --no-frozen-lockfile && (cd artifacts/api-server && node build.mjs)
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STEEL_API_KEY
        sync: false
      - key: NEUROBUDDY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
