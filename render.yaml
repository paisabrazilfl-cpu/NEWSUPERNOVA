services:
  - type: web
    name: bos-aura
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Build is handled by GitHub Actions (.github/workflows/deploy.yml):
    #   1. GA installs deps + runs pnpm --filter @workspace/api-server run build
    #   2. GA commits the built dist/ back to main with [skip ci]
    #   3. GA triggers this Render service deploy via API
    # Render itself just uses the prebuilt dist — no build step needed here.
    buildCommand: echo dist is prebuilt
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_PATH
        value: /
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bos-aura-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STEEL_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: NEUROBUDDY_API_KEY
        sync: false

databases:
  - name: bos-aura-db
    plan: free
    region: oregon
    databaseName: openclaw_db_te42
    user: openclaw_db_te42_user
